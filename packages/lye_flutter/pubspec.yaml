name: lye_flutter
description: Log Your Event (LYE) Flutter adapters - navigator observer, Riverpod 3 provider observer, pointer tracker with explicit LyeTrackable tags, error and lifecycle hooks, HTTP batch shipper. Riverpod-only, no StatefulWidget.
version: 0.1.0
publish_to: none
repository: https://github.com/CristiPerciun/log-your-event

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.1.0
  http: ^1.6.0
  lye_core:
    path: ../lye_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
