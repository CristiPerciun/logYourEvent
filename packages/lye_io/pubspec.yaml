name: lye_io
description: Log Your Event (LYE) file layer - CSV files with rotation and chained manifests, directory verification, operation timeline and the `lye` command line tool. Requires dart:io (server, desktop, mobile; not web).
version: 0.1.0
publish_to: none
repository: https://github.com/CristiPerciun/log-your-event

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  lye_core:
    path: ../lye_core
  path: ^1.9.1

dev_dependencies:
  lints: ^6.0.0
  test: ^1.31.0

executables:
  lye: lye
