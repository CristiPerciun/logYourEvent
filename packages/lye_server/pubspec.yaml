name: lye_server
description: Log Your Event (LYE) server side - ingest of client batches with chain verification, tracing helpers for scoped transactions, SQL statements, audit events and jobs, daily export, anchoring of stream heads and retention purge. Framework-agnostic (no Serverpod dependency).
version: 0.1.0
publish_to: none
repository: https://github.com/CristiPerciun/log-your-event

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  lye_core:
    path: ../lye_core
  lye_io:
    path: ../lye_io
  meta: ^1.18.0
  path: ^1.9.1

dev_dependencies:
  lints: ^6.0.0
  test: ^1.31.0
